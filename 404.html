<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Page not found | Auto-Key-Spam</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c10;color:#e8eaed;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;text-align:center;background:#12151c;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:56px 40px}
.code{font-size:88px;font-weight:800;color:#b8f53d;letter-spacing:-.02em;line-height:1}
h1{font-size:22px;margin:16px 0 10px}
p{color:#9aa0a6;font-size:15px;line-height:1.6;margin-bottom:28px}
a{display:inline-block;background:#b8f53d;color:#0a0c10;text-decoration:none;font-weight:700;font-size:15px;padding:12px 28px;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<div class="code">404</div>
<h1>Page not found</h1>
<p>The page you are looking for does not exist or was moved.</p>
<a href="/">Back home</a>
</div>
</body>
</html>
